# SonarQube Cloud analysis settings.
#
# Two warnings prompted this file. Both were about the scanner not being told
# things the repository already knows.

# projectKey and organization are deliberately absent. This repository is
# scanned by SonarQube Cloud's automatic analysis, which already knows its own
# project binding; those two keys identify a CI-driven scan and their presence
# is what tells the service to stop analysing automatically. Adding them would
# silence the warnings by silencing the whole analysis.

# Without this the scanner analyses Python against every 3.x at once and
# reports rules that cannot both apply. The scripts are the fixture generators
# and the plot renderer; all five parse under 3.11, and the one using builtin
# generics in annotations carries `from __future__ import annotations`, so 3.11
# is what the project is developed and verified against rather than the oldest
# version that might work.
sonar.python.version=3.11

# The scanner reported file-encoding problems. Every tracked text file is valid
# UTF-8 with no BOM; the files it could not decode are images and icons, which
# are excluded below. Stating the encoding stops it guessing from the platform
# locale, which differs between a developer machine and CI.
sonar.sourceEncoding=UTF-8

# IMPORTANT: the scope directives below (sonar.sources, sonar.exclusions, and the
# issue-ignore rules) are ALSO set in the SonarQube Cloud UI, under this project's
# Analysis Scope settings, because automatic analysis does not apply them from
# this file. The UI settings are what is ENFORCED; the copies here are the
# version-controlled record, so a fork, a re-import, or a reviewer can see what is
# de-scoped and why. Adding the projectKey/organization above plus a scanner step
# switches to a CI-driven scan, which makes this file authoritative instead.

sonar.sources=src,public
sonar.tests=tests

# Binaries carry no source to analyse, and generated or vendored trees would
# report defects nobody can act on in the place they appear.
#
# scripts/ and benchmarks/ are developer and CI tooling — fixture generators,
# the release-gate checks, the benchmark harness — not code that ships to a user
# or runs in the browser. Analysing them held the toolbox to the application's
# standards and filed thousands of maintainability nits that buried the shipping
# code the gate exists to guard, so analysis is scoped to src and public. Bugs
# that matter in the tooling are caught by the test suite and the release gate,
# and fixed at the source rather than left as advisory noise.
sonar.exclusions=\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.webp,**/*.svg,\
  **/*.las,**/*.laz,**/*.ply,**/*.bin,**/*.copc.laz,\
  dist/**,release/**,node_modules/**,docs-site/.vitepress/cache/**,\
  validation/snapshot/**,scripts/**,benchmarks/**

# Fixtures are inputs to tests, not tests, and are frequently generated.
sonar.test.exclusions=tests/fixtures/**

# Cognitive Complexity (S3776) and the parameter-count rule (S107) score a
# subjective shape, not correctness. In the numeric cores — the arithmetic
# coder, the CRS maths, the terrain and volume estimators — splitting a function
# to meet a threshold scatters logic a reviewer can currently read in one place,
# and risks the one failure this tool exists to avoid: a silently wrong number.
# Correctness there is held by the test suite and the mutation gate, so these two
# advisory metrics are not analysed. A raised threshold instead of a disable is a
# Quality Profile change in the SonarQube Cloud UI.
#
# S7767 flags every `| 0`. This project uses `| 0` deliberately for 32-bit
# semantics in the hash, codec, and PRNG cores, where `Math.trunc` would be
# wrong, and elsewhere for bounded index truncation. `lint:int-truncation` (in
# the release gate) already vets every one over src/, telling a safe wrap apart
# from a value that could exceed 2^31, so S7767 here is a blunt duplicate of a
# check the repo already runs, more precisely.
#
# The four rules below (e4-e7) arrived with a 2025 Quality Profile update that
# tagged them with a RELIABILITY impact and flagged pre-existing, intentional
# code as new-code reliability issues. None is a defect this codebase can act on:
#
#   S7758 (Unicode-aware string methods) fires on charCodeAt/fromCharCode in the
#   LAS, PNG, PLY, PTX, E57 and PDF byte parsers, where a code unit is a byte on
#   purpose (a `& 0x7f` ASCII fold, an `=== 13` test for a carriage return).
#   codePointAt/fromCodePoint would be wrong for byte-level I/O.
#
#   S7781 (prefer replaceAll) and S7773 (prefer Number.NaN) are modernization
#   nits: the current forms are correct and exercised by the test suite. They are
#   mis-tagged as reliability, not defects.
#
#   S8786 (regex non-linear backtracking) fires on anchored single-quantifier
#   patterns such as /=+$/ and /\.+$/ over bounded parsed tokens (a base64
#   string, a hostname, a NUL-terminated WKT), which cannot backtrack
#   catastrophically. JavaScript has no possessive quantifier or atomic group to
#   satisfy the rule, so the only "fix" is rewriting a safe regex as a loop,
#   trading a clear expression for a more error-prone one. e8 is the JavaScript
#   analyser's key for the same rule (public/sw.js).
#
# The genuine bug in this batch, css:S4656 (a property declared twice), was FIXED
# in the stylesheets rather than ignored.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S7781
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S7773
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*

# Coverage is produced by the same run Codecov consumes, so both read one
# measurement rather than two that can disagree.
# One key, not two: the TypeScript-specific form is deprecated and the
# JavaScript one is what the analyser reads for both languages.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
