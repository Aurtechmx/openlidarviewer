    requiredEvidence: E5_EXTERNALLY_VALIDATED
    supportingTests: [tests/measure*.test.ts, tests/measurementAnalyticalFixtures.test.ts]
    supportingDatasets: []
    units: [metres, source-units, feet]
    crsDatum: "Horizontal only; converts native→metres when linear unit is known; refuses metric distance in geographic degrees."
    assumptions: ["pick accuracy is visual-inspection grade", "no lens/registration error modelled"]
    failureModes: ["geographic-degree CRS", "unknown unit", "coarse pick on sparse cloud"]
    exportAllowed: true
    userLabel: "Visual-inspection-grade measurement"
    softwareStatus: shipping
    evidenceLevel: E3_SYNTHETICALLY_VALIDATED
    externalValidationStatus: none
    approvedClaim: "Geometric distance in the stated units; visual-inspection grade."
