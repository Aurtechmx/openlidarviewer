# OpenLiDARViewer — machine-readable scientific claim register
# Research-hardening Phase 1. See docs/validation/EVIDENCE_MODEL.md for the
# ladder and field definitions, and src/validation/evidenceLevel.ts for the
# identifiers + gate logic.
#
# Honesty rules (do not violate when editing):
#   - currentEvidence must reflect evidence that EXISTS today. Ten claims
#     currently reach E4. Five are algorithm cross-implementations against
#     GDAL 3.13.1 on a frozen analytic fixture: SLOPE-RASTER, ASPECT-RASTER,
#     HILLSHADE and CONTOURS (0.5 degree for slope and aspect, 1.0 8-bit level
#     for hillshade, 0.05 m contour-position distance for contours), plus
#     MEAS-AREA against GDAL/OGR OGR_GEOM_AREA on a planar-polygon fixture. Three
#     are surface-gridding cross-implementations against PDAL 2.10.2
#     writers.gdal on seeded synthetic clouds: DSM (max return) and DTM (min
#     return), each agreeing over 7500 cells within a 0.05 m registered
#     tolerance, and CHM (clamped max minus min) agreeing over 7500 cells within
#     a 0.1 m registered tolerance. Two are terrain descriptors compared three
#     ways (an independent tool AND the closed form) on a controlled analytic
#     fixture: TPI against gdaldem 3.13.1 within 1e-5 on a low-amplitude
#     quadratic (chosen so the reference's float32 mean accumulation stays below
#     the tolerance), and VRM against SAGA 7.8.2 within 1e-4 on a smooth tilted
#     quadratic (chosen so Horn and SAGA normals converge), with OLV reproducing
#     the closed-form Sappington VRM to under 1e-9. The slope, hillshade and contour tolerances were registered
#     before the reference was generated: all three were fixed in the harness
#     commit a78b0f9 on 2026-07-05, weeks ahead of their results. ASPECT-RASTER
#     was NOT. Its slot, its tolerance, its flat-ground exclusion and its
#     reference raster all landed in 40e2ca1 on 2026-07-26, so no commit shows
#     its gate while it had no result; carrying slope's number over is
#     defensible, and it is not a preregistration and must not be written as
#     one. Per-claim freeze provenance, with the commit to check, is in
#     validation/protocols/. The DSM and DTM cross-checks exercise the cell
#     gridding over bare or overlaid synthetic clouds where the reference radius
#     is below half a cell, not ground classification (GROUND-FILTER, still
#     partial) or real-terrain void interpolation. No claim reaches E5 (no field
#     validation has been run). Synthetic known-truth fixtures alone remain E3,
#     not accuracy.
#   - externalValidationStatus is `pending` wherever external data is required
#     and unavailable. Ten independent reference slots are supplied (six GDAL,
#     three PDAL, one SAGA); all remaining independent-reference slots are
#     pending. Never infer it from density / format / metadata.
#   - prohibitedClaim lists statements the current evidence does NOT support.
#   - scope states, in the shape the study manifests use, what the evidence
#     covers (scope.supported, dataset + parameter-set pairs) and what it does
#     not (scope.unsupported). A claim below E4 has no cross-implementation
#     study behind it, so its scope.supported is empty and the boundary lives
#     entirely in scope.unsupported. scripts/lint-claim-register.mjs refuses a
#     claim with no scope, and refuses a scope.supported entry no supporting
#     study supports.
#   - supportingStudies names the cross-implementation study manifests behind an
#     E4 claim. The ids must exist under validation/cross-implementation/studies/,
#     must be studies for this claim, and must carry a status that measured
#     something. Registered-but-not-run cannot hold a claim up.
#   - externalValidationRecords is what an E5 or E6 claim would have to name,
#     under validation/field/ or validation/reproduction/. No claim is at either
#     level, and neither can be produced from inside this repository, so the
#     lint fails any claim that reaches for one without the record.
#
# This is a living document; update an entry in the same change that alters its
# product. A product with no entry is treated as E0 / not exportable.
#
# Phase 3–4 tooling (v0.5.8) — mechanisms exist to REACH the required levels:
#   - Cross-implementation harness: src/validation/crossCheck.ts +
#     docs/validation/cross-implementation.md. The SLOPE-RASTER, ASPECT-RASTER
#     and HILLSHADE GDAL reference slots are supplied and promote those three
#     claims to E4; all remaining reference slots are pending, each awaiting a
#     real PDAL/GDAL/CloudCompare reference committed.
#   - Honest estimators: src/terrain/validate/spatialBlockHoldout.ts
#     (spatially-blocked hold-out, less optimistic than random point hold-out,
#     with a bootstrap CI) and src/terrain/validate/reliabilitySplit.ts
#     (measured-cell empirical reliability + Wilson CI, kept distinct from
#     interpolated model-based support).
#   - Typed units: src/units/units.ts makes source-unit / metre confusion a
#     compile error at the measurement + CRS boundaries.

schemaVersion: 1
# Claims last reviewed at 0.5.9. Neither the 0.6.0-alpha.1 wave (streaming decode,
# session import, density units, project-frame foundation) nor alpha.2 (test gates,
# composition root, architecture map) changed what these terrain / measurement
# algorithms compute, so their evidence is inherited unchanged into the alpha.
# alpha.2 DID correct two unit/axis defects at the reporting boundary — box height
# now follows the scan up-axis, and the Horn slope guard rejects a non-positive
# cell size — but neither alters an algorithm's evidence level.
# alpha.3 changed the EVIDENCE STATE of one claim without changing any algorithm:
# SLOPE-RASTER is promoted E3→E4 by a committed GDAL 3.13.1 cross-implementation
# reference. All other terrain and measurement evidence is unchanged.
# 0.6.1 corrects two vertical-unit defects at the reporting boundary — LAS 1.4
# conversion keeps the vertical datum and unit GeoKeys beside the WKT, and
# contour GeoJSON labels each elevation with the resolved vertical unit instead
# of always saying metre — and adds a finite-position refusal to the EPT laszip
# decoder. None of the three changes what an algorithm computes, so every
# evidence level is inherited unchanged.
# 0.6.2 changes the EVIDENCE STATE of two more claims without changing any
# algorithm: ASPECT-RASTER and HILLSHADE are promoted E3->E4 by committed GDAL
# 3.13.1 cross-implementation references, generated on the same frozen fixture
# the slope reference uses and pinning it by hash. The hillshade leg against
# GDAL is a weak instrument on its own, because the two implementations' byte
# encodings differ by up to one level and the gate is one level; that claim
# rests on the closed-form leg and on an exact re-encoding identity, and the
# limit is recorded in docs/validation/cross-implementation.md. 0.6.2 also
# fixes eighteen defects, four of which reached published v0.6.1 output and are
# corrected in docs/release/ERRATUM_v0.6.2.md; none of the eighteen changes
# what a registered algorithm computes except the geodesic void fill, whose
# unit correction changes interpolated heights on geographic and mixed-unit
# compound frames. No claim's evidence level moves on that account, because the
# fixtures behind every level are projected metre frames. softwareVersion below
# is stamped at release time.
# 0.6.3 adds scope, supportingStudies and externalValidationRecords, and moves no
# claim. SLOPE-RASTER, ASPECT-RASTER and HILLSHADE now cite the study manifests
# that record the comparisons they were already at E4 on, and each states what
# its evidence does not reach. The 24-fixture GDAL matrix under
# validation/cross-implementation/raster-matrix/ is named in those scopes for
# what it produced, which is boundaries: the halved border slope, the geographic
# aspect divergence with no reference to arbitrate it, the multidirectional
# hillshade split, and the nodata-halo difference. Every one of those narrows a
# claim. None of them promotes one, and the per-claim scopeNote says so.
# 0.6.6 changes the EVIDENCE STATE of two claims without changing any algorithm:
# DSM and DTM are promoted E3->E4 by committed PDAL 2.10.2 writers.gdal
# cross-implementation references over three seeded synthetic clouds each,
# agreeing over 7500 cells within a 0.05 m tolerance registered before the
# references were generated (recorded in DSM-PDAL-WRITERS-GDAL-CELL-CENTRED and
# DTM-PDAL-WRITERS-GDAL-CELL-CENTRED). The agreement covers the cell gridding:
# the reference radius is below half a cell, so it does not exercise a divergent
# neighbourhood search, and the DTM clouds are bare-earth by construction, so it
# does not exercise ground classification (GROUND-FILTER stays partial) or
# real-terrain void interpolation. DTM's required bar therefore remains E5.
# CHM is promoted the same cycle by CHM-PDAL-WRITERS-GDAL-DIFFERENCE: OLV's
# heightAboveGround (clamped DSM minus DTM) agrees with the PDAL max grid minus
# the PDAL min grid over 7500 cells within the 0.1 m tolerance registered at
# pending, max difference under 8e-6 m. It rests on the two already-validated
# grids and the same below-half-a-cell radius, so it adds the differencing
# arithmetic and not ground classification or real canopy.
softwareVersion: 0.6.6
generated: 2026-07-26
validationOwner: A. Urias / Aurtech

