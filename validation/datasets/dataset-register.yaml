# Validation dataset register
#
# WHAT THIS IS FOR. Cross-implementation comparisons and field studies have so
# far named their inputs in prose ("the analytic DEM", "a Swiss COPC tile"). A
# reader cannot tell from prose whether two studies used the same bytes, whether
# the licence allowed the use, or whether the checkpoints were independent of
# processing. Every record below gets a `datasetId`, and a later study cites that
# id instead of describing the data again.
#
# WHAT IT IS NOT. No record here asserts a result. A dataset being registered
# means its provenance is written down, not that anything was validated with it.
#
# ─── Why `storage` exists ────────────────────────────────────────────────────
# Every record must carry `sourceSha256`, and large point clouds must not be
# committed to this repository. Those two requirements collide: for a dataset
# that is not in the tree, a verifier reading a recorded hash cannot tell
# whether the file is missing by accident or was never meant to be here.
# `storage` states the intent, so the two cases separate cleanly:
#   committed:  the bytes are in this repository at `localPath`. The verifier
#               recomputes the hash and fails on drift, and fails if the file
#               is absent.
#   acquired:   the bytes were fetched by whoever ran the study and live
#               outside the tree. The recorded hash is what they must match;
#               no local file is expected, so absence is not an error.
#   restricted: access is limited and the bytes were deliberately not
#               retrieved here. `sourceSha256: not-fetched` is legal for this
#               case and for this case only.
# Without the field, "hash recorded, file absent" is ambiguous, and a verifier
# has to choose between passing real breakage and failing correct records.
#
# ─── Sentinels ───────────────────────────────────────────────────────────────
# `not-applicable`: the quantity has no meaning for this dataset (point density
# of a raster). `unknown`: it has meaning and was not measured. The two are kept
# apart so a check can demand a number in the second case without nagging about
# the first.
# `local-metric-grid` / `local-foot-grid`: the file declares no CRS at all. An
# honest sentinel, not a guess at which projection the origin resembles.
#
# ─── Rules ───────────────────────────────────────────────────────────────────
# Shape: validation/datasets/dataset-register.schema.json
# Checks: node scripts/verify-dataset-register.mjs
# Never record a coordinate for a restricted site, or an access path to it. The
# verifier rejects precise coordinate pairs on restricted records, but the rule
# is the author's to keep first.

