    citation: "OpenLiDARViewer steep analytic DEM fixture, generated by scripts/make-steep-dem-fixture.mjs."
    knownLimitations: "Covers the slope range OLV-DS-001-ANALYTIC-DEM does not, and nothing else about it is stronger. No GDAL reference raster has been produced from it, so no comparison has been run and this record asserts no result. It is smooth and differentiable everywhere: reaching 65 degrees on an analytic quadratic is a test at steep gradient, not a test against steep terrain, which has cliffs, ridges, talus and noise this surface has none of. Being quadratic its curvature is the constant 2a/2b/c everywhere, so slope varies at fixed curvature within the grid, but its coefficients are roughly five times OLV-DS-001's, so comparing agreement across the two DEMs varies slope and curvature together and a difference cannot be attributed to slope alone. Starts from a DEM, so it says nothing about the point-cloud to DTM path. No CRS is written into the ASCII Grid header; axes are metres on an arbitrary origin."
    storage: committed
    localPath: tests/fixtures/dem-steep/input-dem.asc
