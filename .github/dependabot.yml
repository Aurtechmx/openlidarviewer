# Dependabot — automated dependency update PRs.
# Keeps three / loaders.gl / pdf-lib / proj4 / laz-perf and the toolchain current
# so security fixes land as reviewable PRs rather than silent drift.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release has to be public for a week (two for a major) before it is
    # offered, so a freshly published malicious version is usually yanked
    # before it reaches a pull request. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    # Group the noisy dev-tooling bumps into one PR; keep runtime deps separate
    # so a three/loaders.gl bump gets its own focused review.
    groups:
      dev-tooling:
        dependency-type: "development"
        # @loaders.gl/las is a development dependency, so this group took it
        # first and moved it apart from the rest of the set below.
        exclude-patterns:
          - "@loaders.gl/*"
      # The loaders.gl packages must move as a set: every 4.5.x loader declares a
      # peer dependency on @loaders.gl/core ~4.4.0, so a bump that moves core on
      # its own cannot install. One grouped PR shows that conflict in a single
      # place instead of splitting it across four.
      loaders-gl:
        patterns:
          - "@loaders.gl/*"
    ignore:
      # @loaders.gl/core 4.5.1 cannot be installed: every 4.5.1 loader declares a
      # peer dependency on @loaders.gl/core ~4.4.0, so npm cannot resolve the
      # tree. Reported upstream as visgl/loaders.gl#4027. Only this version is
      # ignored, so the release that fixes the peer range is still offered.
      - dependency-name: "@loaders.gl/core"
        versions: ["4.5.1"]
      # @playwright/test 1.64.0 and 1.64.1 ship the same WebKit build. It
      # refuses the built-in stylesheet of every <select> under a style-src
      # without 'unsafe-inline', and it stalls camera moves, view button clicks
      # and orbit drags in the Linux end-to-end runs. Only 1.64 is ignored, so
      # the next release is still offered.
      - dependency-name: "@playwright/test"
        versions: ["1.64.x"]
    labels:
      - "dependencies"

  # The Node oracles installed into the validation image. A separate manifest
  # and lockfile from the product's, never shipped, but its advisories are
  # still reported against this repository, so it is kept current too.
  - package-ecosystem: "npm"
    directory: "/validation/oracles/npm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      oracle-tooling:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # An action release is public for a week before it is offered. Dependabot
    # takes no per-semver delay for this ecosystem, so majors wait a week too.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
