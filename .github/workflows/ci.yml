name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege: every job only needs to read the checked-out code. Matches
# the security workflow; tighten so a compromised action can't write to the repo
# or mint tokens. Declared per job rather than once at the top: a workflow-level
# grant is inherited by anything added later, including a job that should have
# had none, so each job below states what it needs.
jobs:
  # Static checks + both build contracts. Cheap and fast; everything else
  # depends on it so a typecheck or bundle regression fails before the heavier
  # test shards and the browser jobs run.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      # `npm ci` must not rewrite the lockfile. If it does, the resolved tree
      # is not the one the SBOM, the audit, and the evidence describe.
      - name: Lockfile is unchanged by a clean install
        run: git diff --exit-code -- package-lock.json
      # The gate has to be runnable from what people actually download. A stage
      # that reads an export-ignored file passes here and dies for them, which
      # is not something a test can catch: every test runs in the tree that has
      # the file. This reconstructs `git archive` output and runs the gate lints
      # inside it.
      - name: Release gate survives the published source shape
        run: npm run verify:archive-gate
      - name: Typecheck
        run: npm run typecheck
      - name: Main-deferral lint (no top-level viewer.* deref outside viewerLoaded)
        run: npm run lint:main-deferral
      - name: Inline dynamic import lint (no raw import('./…') in main.ts — obfuscator-scramble guard)
        run: npm run lint:inline-imports
      - name: unsafeHtml lint (no user-derived string reaches an innerHTML sink)
        run: npm run lint:unsafe-html
      - name: Release sync (version/lock/README/CHANGELOG/notes consistent)
        run: npm run lint:release-sync
      - name: Layer-boundary lint (science/core imports no UI or three.js)
        run: npm run lint:layer-boundaries
      - name: Claim-register lint (YAML ↔ runtime registry in sync, no banned wording)
        run: npm run lint:claim-register
      - name: Dataset-citation lint (one dataset per ordinal, every cited id resolves)
        run: npm run lint:dataset-citations
      - name: Oracle-registry lint (every cited oracle registered, no lineage double-counted)
        run: npm run lint:oracle-registry
      - name: Oracle-consensus lint (every triangulation record is contract-shaped and test-backed)
        run: npm run lint:oracle-consensus
      - name: E5 input-manifest verify (immutable digest, no dup tiles, creation ≠ acquisition)
        run: npm run validation:e5:manifests:verify
      - name: Reference-strategy lint (every consensus record classifies + is test-backed)
        run: npm run lint:reference-strategy
      - name: No source files git-ignored
        run: npm run lint:no-ignored-src
      - name: No git-ignored path is tracked (local tooling committed by `git add -A`)
        run: npm run lint:no-tracked-ignored
      - name: No tracked file names the build machine
        run: npm run lint:no-host-paths
      - name: No source file embeds a raw control byte
        run: npm run lint:no-source-control-chars
      - name: Generated claim registry is committed (regenerate → no diff)
        run: npm run gen:claim-registry && git diff --exit-code
      - name: Bucket partition integrity (every test file in exactly one bucket)
        run: npm run test:buckets:verify
      - name: Release-truth lint (public docs match the machine state)
        run: npm run lint:release-truth
      - name: SBOM lint (CycloneDX root + components match the lockfile)
        run: npm run lint:sbom
      - name: Third-party notices lint (licence texts match the installed packages)
        run: npm run lint:notices
      - name: Dataset attribution lint (attribution-required datasets are credited)
        run: npm run lint:dataset-attribution
      - name: Position-access lint (world coordinates go through the accessor)
        run: npm run lint:position-access
      - name: Int-truncation lint (no bitwise wrap on a value that can exceed 2^31)
        run: npm run lint:int-truncation
      - name: Monolith size ratchet (main.ts / Viewer.ts may not grow)
        run: npm run lint:monolith-size
      - name: Default colour ramps rise in lightness
        run: npm run lint:palette-lightness
      - name: Evidence lint (documents match the recorded test evidence)
        run: npm run lint:evidence
      - name: Dependency singletons (one copy of each critical package)
        run: npm run check:deps
      # The gates below ran only inside the release gate (`npm run gate`, tags
      # and manual dispatch only), so a pull request could not fail them. Each
      # is cheap and catches a mistake a contributor makes in a pull request,
      # which is why they belong here rather than only on a tag. Measured in
      # this repository: the six lints are sub-second each, archive portability
      # is 6 s. They sit after the tree-cleanliness checks above because
      # archive portability writes its record into the gitignored release/.
      - name: CSP lint (no inline script in a shipped page)
        run: npm run lint:csp-html
      - name: HTML asset lint (every local reference in a shipped page resolves)
        run: npm run lint:html-assets
      - name: Python version lint (.python-version and sonar agree)
        run: npm run lint:python-version
      - name: Flow-oracle agreement (D8 routing + accumulation vs. the frozen record)
        run: npm run validation:field-simulation:verify
      - name: Upload-queue wiring lint (the streaming path still reaches the queue)
        run: npm run lint:upload-queue-seam
      - name: Claims-language lint (no comparative marketing claims in public docs)
        run: npm run lint:claims-language
      - name: Archive-vocab lint (shipped files stay in a product-facing voice)
        run: npm run lint:archive-vocab
      # 6 s measured, so it rides this job instead of paying npm ci and runner
      # setup again in one of its own. Running only on a tag is how 22 files of
      # `.agents/` plugin scaffolding merged through a green pull request and
      # then failed a clean checkout of main with 18 unresolvable links.
      - name: Archive portability (a release archive verifies with no repo around it)
        run: npm run benchmark:archive-portability
      # The PRESENCE leg only (0 s): every file the published scripts run is
      # tracked. The expensive part of clean-clone.yml is its uncached `npm ci`
      # against the registry, which this cannot and does not replicate; that
      # leg stays weekly and on tags. Untracking a file an npm script invokes
      # is a pull-request mistake, so the leg that catches it runs here.
      - name: Clean-clone presence leg (every file the scripts run is tracked)
        run: npm run benchmark:clean-clone
      # docs.yml builds the site only on push to main, so a pull request that
      # broke the docs build or published a forbidden document went green and
      # failed after merging. 3 s measured. Placed after the claim-registry
      # diff check above because docs:render rewrites a tracked file, and a
      # drift here should be reported as a docs failure rather than as that
      # step's diff.
      - name: Docs site builds (renders the claim register, checks the allowlist)
        run: npm run docs:build
      - name: Method literals match the registry
        run: npm run lint:method-literals
      # Two DISTINCT size contracts, both enforced:
      #  • test:build  → PLAIN build + chunk-isolation (only vendor-three-webgpu
      #    may exceed the 500 KiB isolation threshold).
      #  • build:live + check:bundle → the OBFUSCATED build that actually ships,
      #    gated against its own (larger) per-chunk budget.
      # The live index is legitimately larger than the plain one; gating each
      # build against its own rule keeps both honest instead of running the
      # plain-build isolation rule against the shipped artifact.
      - name: Chunk-isolation contract (plain build)
        run: npm run test:build
      - name: Live-shell bundle budget (obfuscated build that ships)
        run: npm run build:live && npm run check:bundle
      - name: No test seam in the shipped build
        run: npm run check:no-test-seam
      - name: No maintainer URL flags in the shipped build
        run: npm run check:no-dev-flags

  # Test buckets as a matrix: a failure points at one bucket, output stays
  # small, and the four shards run in parallel instead of one monolithic run.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    # Bound a hung bucket so it fails fast instead of burning the default 360 min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # The large buckets are sub-sharded so no single vitest process runs the
      # whole 231-file `unit` (or 105-file `terrain`) set — a big process is the
      # one that can fail to terminate at shutdown on a constrained runner.
      # vitest --shard=i/n splits deterministically by file, so the shards
      # partition the bucket exactly (verified: unit 1/3+2/3+3/3 = the full
      # count). Small buckets run whole (1/1).
      matrix:
        include:
          - { bucket: unit, shard: "1/3" }
          - { bucket: unit, shard: "2/3" }
          - { bucket: unit, shard: "3/3" }
          - { bucket: terrain, shard: "1/2" }
          - { bucket: terrain, shard: "2/2" }
          - { bucket: slow, shard: "1/2" }
          - { bucket: slow, shard: "2/2" }
          - { bucket: export, shard: "1/1" }
          - { bucket: ui, shard: "1/1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The defect-chronology verifier resolves the commits the records
          # name. A depth-1 clone cannot see them, so it degrades to
          # environment-unavailable and verifies nothing.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      # scripts/test-bucket.mjs is the SINGLE source of the worker cap (2, to
      # match these ~2-core runners): passing --maxWorkers here as well would
      # make vitest reject a duplicate single-value option before any test runs.
      # --reporter=dot keeps the log small so a failure is easy to locate.
      - name: Test bucket — ${{ matrix.bucket }} (shard ${{ matrix.shard }})
        run: npm run test:${{ matrix.bucket }} -- --shard=${{ matrix.shard }} --reporter=dot

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    # Blocking gate: the smoke spec catches the class of bug where the bundle
    # builds and the unit tests pass but the page throws on load in a real
    # browser. Two specs, ~10 s; failure here means the artifact should not
    # ship.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Smoke tests (normal build)
        run: npm run test:smoke
      - name: Smoke tests (live / obfuscated artifact)
        # Boots the build users actually get: the obfuscator scrambles dynamic
        # import() / worker-URL string literals, so a chunk that loads fine in
        # the plain build can 404 only on the live build. This is the gate that
        # catches that class of live-only breakage.
        run: npm run test:smoke:live
      - name: Mobile responsive smoke (320 / 375 viewports — blocking)
        # Deterministic layout/touch-target checks at the smallest viewports.
        # Backs the mobile-usability claims in the release notes.
        run: npm run test:smoke:mobile

  e2e-deterministic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    # BLOCKING. Everything in the suite whose result does not depend on the
    # runner's GPU: DOM, layout, routing, export, and streaming-logic flows.
    # Untagged specs land here by default.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Deterministic end-to-end tests (blocking)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deterministic
          path: playwright-report/
          retention-days: 7

  e2e-gpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    # Advisory: specs tagged `@gpu`, whose outcome varies with the WebGPU
    # adapter a runner exposes (the equivalence probe legitimately falls back on
    # a headless sandbox). Reported, never blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: GPU-variable end-to-end tests (advisory)
        run: npm run test:e2e:gpu
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-gpu
          path: playwright-report/
          retention-days: 7

  # ── Coverage, reported not enforced ───────────────────────────────────────
  # Deliberately absent from ci-green's `needs`. The release gate already runs
  # coverage as a mandatory stage and refuses an evidence record without it, so
  # the authoritative measurement is not this job. What this adds is an
  # external, per-pull-request view a reviewer can read without running the
  # suite. Making it blocking would put merges at the mercy of a third-party
  # service being reachable, to re-assert a number the gate already owns.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Runs the whole suite, including the defect-chronology checks, which
          # resolve the commits the records name. A depth-1 clone makes those
          # degrade to unverified, so the strict contract would never be
          # exercised anywhere.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # Four lockfile entries declare an install script: three copies of
      # fsevents, which is darwin-only and is not installed on this runner, and
      # vitepress's nested esbuild, which resolves its binary from a platform
      # package and works without one. Nothing else can run code at install
      # time, so disabling scripts removes that path at no cost. Measured on a
      # full `npm ci --ignore-scripts` tree: the install succeeds, the
      # typecheck, the laz-perf wasm tests and the production build all pass,
      # and the resolved tree differs from the scripted install in nothing the
      # suite reads. Playwright browsers come from an explicit
      # `playwright install` step, which this flag does not touch.
      - run: npm ci --ignore-scripts
      - name: Collect coverage
        run: npm run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          # A coverage upload failing must not read as a broken build.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Firefox and WebKit ────────────────────────────────────────────────────
  # The deterministic Playwright set on the two engines that are not Chromium.
  # A viewer that renders through WebGPU with a WebGL 2 fallback cannot claim to
  # work in a browser nobody ran it in. Both jobs are blocking and listed in
  # `ci-green`'s `needs`.
  #
  # Firefox runs headful under Xvfb: Firefox's headless widget on Linux cannot
  # produce a WebGL 2 context, so the viewer would have nothing to render into.
  # See the note on the `firefox` project in playwright.config.ts.
  e2e-firefox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Firefox
        run: ./node_modules/.bin/playwright install --with-deps firefox
      # Rounds out Mesa's DRI drivers. Measured on ubuntu 24.04: the leg gets a
      # WebGL 2 context without this (xvfb depends on libgl1, so `--with-deps`
      # already drags in libGLX_mesa), but with only that much the context
      # advertises 16 extensions instead of 17. This step is here so the job
      # runs the full GL feature set. llvmpipe is a software rasteriser,
      # which is fine at this size: the e2e fixtures are a 10-point PLY, a small
      # LAS, and a 3,600-point synthesised grid.
      - name: Round out the software OpenGL stack for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1 libgles2
      # `xvfb-run` supplies the display that lets Firefox start
      # headful, and headful is the only configuration in which it produces a
      # WebGL 2 context on Linux; no pref substitutes for it. See the note on
      # the `firefox` project in playwright.config.ts for the measurements.
      # xvfb itself already comes from `--with-deps` (Playwright's shared tools
      # list installs it), so nothing extra is needed to get the binary.
      # A missing software renderer fails the job before Playwright starts.
      # Without it Firefox has no WebGL 2 context and the suite would only
      # time out, so this step stops the job with an error that names the
      # cause. The preflight spec then checks the context before the suite runs.
      - name: Verify the runner has a software OpenGL renderer
        run: |
          # `|| true` on both probes keeps `bash -eo pipefail` from ending the
          # step early, so the grep below decides the result and prints the error.
          sudo apt-get install -y --no-install-recommends mesa-utils || true
          xvfb-run -a glxinfo -B > /tmp/glxinfo.txt 2>&1 || true
          if grep -Eiq "llvmpipe|softpipe|software rasterizer" /tmp/glxinfo.txt; then
            echo "software renderer present"
          else
            cat /tmp/glxinfo.txt
            echo "::error::No Mesa software renderer on this runner; Firefox cannot get a WebGL 2 context."
            exit 1
          fi
      - name: Verify Firefox gets a WebGL 2 context
        run: |
          xvfb-run -a ./node_modules/.bin/playwright test \
            --project=firefox-preflight
      # One Xvfb per worker, not one `xvfb-run` screen for all of them. With a
      # shared screen and no window manager the workers' Firefox windows stack
      # on one another, and a covered window gets no animation frames and loses
      # the pointer to real crossing events, which is what timed out clicks
      # ("waiting for element to be ... stable"), emptied the nav probe and
      # stole hovers. OLV_FIREFOX_DISPLAYS hands each worker its own display
      # (see FIREFOX_DISPLAYS in playwright.config.ts); --workers must match
      # the number of displays so no two workers share one.
      - name: Deterministic end-to-end tests on Firefox
        run: |
          for d in 90 91; do
            Xvfb ":$d" -screen 0 1280x1024x24 -nolisten tcp &
          done
          for d in 90 91; do
            for _ in $(seq 50); do [ -e "/tmp/.X11-unix/X$d" ] && break; sleep 0.1; done
          done
          DISPLAY=:90 OLV_FIREFOX_DISPLAYS=:90,:91 \
            ./node_modules/.bin/playwright test --project=firefox --workers=2
      - name: The suite ran a non-zero number of tests
        shell: bash
        run: node scripts/assert-playwright-ran.mjs playwright-results/results.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 7

  e2e-webkit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright WebKit
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Deterministic end-to-end tests on WebKit
        run: ./node_modules/.bin/playwright test --project=webkit
      - name: The suite ran a non-zero number of tests
        shell: bash
        run: node scripts/assert-playwright-ran.mjs playwright-results/results.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  # ── Windows ───────────────────────────────────────────────────────────────
  # Runs the checks that are pure Node or pure browser on a real Windows
  # runner, so the Windows notes in docs/developer-manual.md are backed by a
  # job. It does not run `npm run gate`, `npm run package`,
  # `npm run package:source`, `npm run build:live` or `npm run evidence`: those
  # shell out to bash and need WSL or Git Bash. Blocking, and listed in
  # `ci-green`'s `needs`.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The defect-chronology and dataset-register verifiers resolve the
          # commits their records name. A depth-1 clone cannot see them, so
          # they fail rather than degrade.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      # ── The viewport-width leg ────────────────────────────────────────────
      # First, because a failed step skips the rest of the job, and this
      # is the leg the job exists for. Putting it behind the exploratory
      # checks would let an unrelated failure hide it.
      #
      # `--with-deps` installs Linux system packages and is not supported on
      # this runner, so the browser is installed without it.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Startup smoke at five viewport widths (320 / 375 / 767 / 768 / 1440)
        # playwright.widths.config.ts reuses the base config's webServer, so
        # the production build and the preview server are paid for once and
        # all five widths share them. 767 and 768 straddle the mobile/desktop
        # breakpoint in src/style.css, which is the boundary a layout
        # regression actually crosses.
        run: npm run test:smoke:widths
      - name: The suite ran a non-zero number of tests
        shell: bash
        run: node scripts/assert-playwright-ran.mjs playwright-results/results.json

      # ── Checks that are pure Node ──
      # Each of these is named in the Windows section of the developer manual
      # as working natively. They run here so that claim is measured.
      - name: Typecheck
        run: npm run typecheck
      - name: Bucket partition integrity
        run: npm run test:buckets:verify
      - name: Position-access ratchet (baseline keys are path-separator sensitive)
        run: npm run lint:position-access
      - name: Layer-boundary lint (walks the layer directories from a file URL)
        run: npm run lint:layer-boundaries
      - name: Main-deferral lint
        run: npm run lint:main-deferral
      - name: Inline dynamic import lint
        run: npm run lint:inline-imports
      - name: unsafeHtml lint
        run: npm run lint:unsafe-html
      - name: No tracked file names the build machine
        run: npm run lint:no-host-paths

      # One shard of the largest bucket. The point is not coverage, since the Linux
      # matrix already runs every shard; it is that the bucket runner spawns
      # vitest at all. On Windows `node_modules/.bin/vitest` is an sh script
      # with no PE header, so the shard used to die before a single test ran.
      - name: Unit test bucket (shard 1/3)
        run: npm run test:unit -- --shard=1/3 --reporter=dot

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-windows
          path: playwright-report/
          retention-days: 7

  # ── The single status to protect the branch with ──────────────────────────
  # Branch protection names one check, not fifteen. Requiring the matrix legs
  # by name would rebind the ruleset every time the sharding changes, and a
  # renamed leg would silently stop being required. This job depends on every
  # blocking job instead, so the ruleset has one stable name to point at.
  #
  # `if: always()` matters: without it a failed dependency SKIPS this job, and
  # a skipped required check sits pending forever rather than failing. The
  # results are read explicitly so a skip is a failure here.
  #
  # e2e-gpu is absent deliberately. It is `continue-on-error`, so its result is
  # success whatever happens, and depending on it would assert nothing.
  ci-green:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [verify, test, smoke, e2e-deterministic, e2e-firefox, e2e-webkit, windows]
    if: always()
    steps:
      - name: Every blocking job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "blocking job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a blocking job reported '$r'"
              exit 1
            fi
          done
          echo "all blocking jobs passed"
