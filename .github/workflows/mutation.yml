name: Mutation

# Mutation testing over the numeric core, on a schedule instead of on every
# tag. It measured about two hours of the v0.6.2 release gate's 2 h 20 m, over
# three modules that most releases do not touch, and paying that per tag bought
# nothing a weekly run does not. The release record no longer reproduces this
# measurement; it CITES it, naming the score, the commit it was measured at,
# and this workflow run.
#
# So the committed record is the product of this workflow, not a side effect:
# `docs/validation/mutation-evidence.json` is written here and opened as a
# pull request against the default branch, which is where `collect-evidence.mjs`
# reads it from when the gate did not run the stage itself. A ruleset requires
# pull requests on that branch, so the workflow cannot push to it directly; run
# 30532907233 scored 96.81, retried a rejected push three times, and lost the
# measurement to a red run that had passed its own threshold.
#
# Two jobs, split by what each one is trusted with. `mutation` executes the
# repository's code and its dev dependencies (Stryker, vitest, their plugins),
# so it holds read-only repository access, no stored git credential, and the
# one dashboard secret on the one step that needs it. `open-pr` holds the write
# permissions but runs no repository code and no npm: it downloads the
# evidence file as data, checks its shape, and opens the pull request. A
# compromised dev dependency can therefore not push a branch or open a pull
# request, because the token that could is never in the job that runs it.
#
# This fails, it does not merely report. `stryker.conf.json` sets break: 75
# against a measured 87.23; the runner breaks on it and
# collect-mutation-evidence.mjs latches the same threshold a second time, so a
# regression is a red run whether or not the runner's exit code survives.
on:
  schedule:
    # 04:00 UTC every Monday — a full run costs about two hours, and the point
    # is to catch a weakening within a week of it landing, not within an hour.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# One mutation run at a time. Two concurrent runs would race to push the same
# evidence file, and the loser's measurement would vanish without a trace.
concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    # The numeric-core run took ~2 h at v0.6.2, but v0.6.3 added killing tests to
    # terrainDerivatives, so each mutant now runs against more tests and the pass
    # overran the old 180-minute cap (the run was cancelled mid-mutation and never
    # reached the dashboard push, leaving the badge "unknown"). 350 minutes stays
    # under GitHub's 6 h job limit while giving the fuller test matrix headroom.
    timeout-minutes: 350
    permissions:
      # Read only. This job runs repository and dev-dependency code.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token is left in .git/config for the code below to find.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # See the note on the same step in ci.yml for what was measured. Two
      # lockfile entries have install scripts, darwin-only fsevents and
      # vitepress's nested esbuild, neither of which this job uses, so install
      # scripts are skipped.
      - run: npm ci --ignore-scripts
      - name: Lockfile is unchanged by a clean install
        run: git diff --exit-code -- package-lock.json

      # Stryker's break threshold makes this step the pass/fail signal. The
      # evidence step below re-checks the same threshold, so neither a
      # swallowed exit code nor a loosened runner config can turn a regression
      # into a green run.
      - name: Mutation run
        env:
          # Enables the dashboard reporter to publish the core score. Absent
          # locally, the reporter skips silently; the run itself is unchanged.
          # Scoped to this step only.
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: npm run mutation

      - name: Record the score, the commit, and this run
        run: node scripts/collect-mutation-evidence.mjs

      - name: Publish the mutation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-reports
          retention-days: 90
          path: |
            reports/mutation/
            docs/validation/mutation-evidence.json

      # The single file the next job consumes, alone in its artifact so that
      # job downloads one data file and nothing else. Skipped when the run
      # failed: a failed run records nothing.
      - name: Hand the evidence file to the pull request job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence
          retention-days: 7
          if-no-files-found: error
          path: docs/validation/mutation-evidence.json

  # Only from the default branch, and only when the figure actually moved.
  # A dispatch against a feature branch still produces the artifacts above;
  # what it must not do is publish a measurement of that branch as the one
  # every release cites. This job runs no repository code and no npm.
  open-pr:
    needs: mutation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # A branch for the evidence file, and a pull request to carry it.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes a branch, so it keeps the token the checkout writes.
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-evidence
          path: incoming

      # The file was produced by a job that ran repository code, so it is
      # treated as data: it must parse as JSON with a plain numeric score
      # before anything is committed or interpolated into a title.
      - name: Take the evidence file
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const e = JSON.parse(fs.readFileSync("incoming/mutation-evidence.json", "utf8"));
            if (typeof e !== "object" || e === null || typeof e.score !== "number" || !Number.isFinite(e.score)) {
              console.error("mutation-evidence.json has no numeric score");
              process.exit(1);
            }
          '
          cp incoming/mutation-evidence.json docs/validation/mutation-evidence.json

      - name: Open a pull request carrying the evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/validation/mutation-evidence.json)" ]; then
            echo "Mutation evidence is unchanged; nothing to record."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/mutation-evidence.json
          SCORE="$(node -p "require('./docs/validation/mutation-evidence.json').score")"
          git commit -m "Record mutation score ${SCORE} from run ${GITHUB_RUN_ID}"
          # A branch per run, so a second run never rewrites the first one's
          # record and two open records are visible as two pull requests.
          BRANCH="evidence/mutation-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --title "Record mutation score ${SCORE}" \
            --body "Written by run ${GITHUB_RUN_ID} of the mutation workflow. The record names the commit it was measured at, so merging it onto a newer tip changes nothing it asserts."
