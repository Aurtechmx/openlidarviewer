# Security CI: scheduled dependency audit.
# The same audit runs in ci.yml as the `npm-audit` job on every pull request,
# every push to main and every release tag, and ci-green requires it. This
# workflow repeats it weekly so a newly disclosed advisory in a pinned
# dependency surfaces without a push.
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (runtime deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No dependency lifecycle script runs during install. The audit reads the
      # resolved tree, so nothing here needs a package's postinstall to have run.
      - run: npm ci --ignore-scripts
      # Fail the job only on high/critical advisories in shipped (non-dev) deps;
      # lower-severity transitive dev noise is reported but not blocking.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
