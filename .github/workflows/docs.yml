# Docs site — build + GitHub Pages deploy, fully isolated from ci.yml and the
# release pipeline. Runs only on pushes to main that touch documentation
# surfaces, builds the VitePress site (which first re-renders the claim
# register from its YAML), verifies the publish allowlist, and deploys.
#
# The site is the canonical project site at https://openlidarviewer.org/, served
# from the apex. docs-site/public/CNAME is what tells Pages to answer on that
# name, and the base is '/' by default. To build for a subpath instead (a
# preview, or a move back to project pages), set DOCS_BASE on the build step —
# the default lives in docs-site/.vitepress/config.mts.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'scripts/render-claim-register.mjs'
      - 'scripts/lint-docs-site.mjs'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_v*.md'
      - 'REPRODUCIBILITY.md'
      - 'ARTIFACT_EVALUATION.md'
      - 'DATA_AVAILABILITY.md'
      - 'REVIEWER_QUICKSTART.md'
      - 'VALIDATION_REPORT_v*.md'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Permissions are declared per job rather than once for the workflow, so a job
# added later starts with nothing until someone names what it needs. The build
# job gets read; the deploy job below grants itself the two write scopes Pages
# needs, so a compromised build step can never publish.

# One deploy at a time; a superseded push just skips to the newest.
concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      # No dependency lifecycle script runs during install; the VitePress build
      # below resolves its platform binaries from the tree npm ci laid down.
      - run: npm ci --ignore-scripts
      - name: Build docs site (renders claim register, then verifies the publish allowlist)
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    # The ONLY job in the repo with Pages write access. The ref guard is
    # defense-in-depth for workflow_dispatch: a dispatch from a non-main ref
    # builds (harmless) but never deploys, independent of the github-pages
    # environment's branch policy.
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Turn Pages on from the workflow itself, so a fresh repo (or one whose
      # Pages source isn't set to GitHub Actions) deploys without a manual
      # Settings step — deploy-pages 404s otherwise. Idempotent when already on.
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
