name: Release

# The exact-tag release run, and the ONLY producer of authoritative evidence.
# It checks out the tag, runs the complete release-mode gate against that exact
# commit, packages the same unchanged checkout, stages the asset set, binds the
# manifest, and verifies the closed set. The tested commit, the packaged
# commit, the evidence commit and the manifest commit are one object by
# construction.
#
# The release-mode gate writes its record to release/ and never touches a
# tracked file. An earlier revision ran the development gate here, which
# regenerates the COMMITTED evidence; the tree came out dirty and the packaging
# step, which refuses a dirty tree, could never pass. The workflow blocked
# itself. OLV_GATE_MODE=release exists because of that run.
on:
  push:
    tags:
      - 'v*'
  # Manual runs are dry runs: every job up to release-ready executes, and the
  # publish job stays skipped unless the ref IS a version tag. A branch cannot
  # be published by dispatching with the right inputs, because there are no
  # inputs to dispatch.
  workflow_dispatch:

# Least privilege, declared per job rather than once for the workflow, so a job
# added later starts with nothing until someone names what it needs. Only the
# publication job is granted write, and only after every blocking job passed.

# A release run must never be replaced mid-flight: cancelling one during
# packaging would leave half a staged asset set behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Cheap refusal ─────────────────────────────────────────────────────────
  # Everything knowable in a second, checked before spending forty minutes.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags, so the ref validator can resolve the target
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # .nvmrc pins the exact canonical version. `node-version: 22` floats
          # to the newest 22.x, which now ships npm 10.9.8 while the evidence
          # asserts the packageManager pin; a floating minor breaks the
          # toolchain check the day upstream cuts a release.
          node-version-file: '.nvmrc'
      - name: Toolchain is the canonical one
        run: |
          node --version
          npm --version
          test "$(node -p 'process.versions.node')" = "$(cat .nvmrc)"
          test "$(npm --version)" = "$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - name: Ref is publishable (tag matches package, HEAD is the tag, tree clean)
        run: node scripts/validate-release-ref.mjs

  # ── Every mandatory stage, one log, one record ────────────────────────────
  # Static gate, e2e, docs build, production audit, fixture checksums and
  # coverage all run here, in release mode, into one gate.log. The evidence is
  # derived from that log's stage markers, so a stage that did not run cannot
  # be described as passed. Mutation is not among them: it runs on its own
  # schedule (mutation.yml) and the record cites its last result, naming the
  # commit that result was measured at. Packaging happens in the SAME job on
  # the SAME still-clean checkout.
  gate:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    # Measured basis: the v0.6.2 release gate took 2 h 20 m wall clock, of
    # which the mutation stage — 188 mutants over the numeric core at ~174
    # tests each — was roughly 2 h. Removing it leaves about 20 minutes of
    # gate, plus npm ci, the Playwright install and packaging. 60 minutes is
    # that measurement with room for a slow runner, and it is short enough that
    # a hung stage is caught the same day rather than five hours later. The
    # scheduled mutation workflow carries its own, larger budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # No dependency lifecycle script runs during install. The browsers the
      # e2e stages need are not a side effect of the install either; the step
      # below fetches them explicitly, from the version the lockfile pinned.
      - run: npm ci --ignore-scripts
      - name: Lockfile is unchanged by a clean install
        run: git diff --exit-code -- package-lock.json
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Release-mode gate (all mandatory stages)
        env:
          OLV_GATE_MODE: release
        run: npm run gate

      - name: Working tree is still clean after the gate
        run: git status --porcelain && test -z "$(git status --porcelain)"

      - name: Package from this same checkout
        env:
          OLV_RELEASE_GATE: '1'
        run: npm run package

      # Everything the stage job needs, in ONE flat directory. Uploading mixed
      # repo-root and release/ paths makes the artifact's internal layout
      # depend on upload-artifact's common-ancestor rule, and the download side
      # then guesses wrong. A flat payload has no layout to guess.
      - name: Assemble the flat release payload
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          mkdir -p release/payload
          cp release/openlidarviewer-*.zip release/payload/
          cp release/gate.log release/gate.log.sha256 release/payload/
          cp "release/test-evidence-v${V}.json" release/payload/
          cp release/production-audit.json release/payload/
          cp sbom.json release/payload/
          cp "RELEASE_NOTES_v${V}.md" release/payload/
          ls -la release/payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload
          retention-days: 14
          path: release/payload/

      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-failure-diagnostics
          retention-days: 7
          path: |
            release/gate.log
            playwright-report/
            test-results/

  # ── Stage, bind, and verify the closed asset set ──────────────────────────
  stage:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload
          path: incoming

      # Nothing is rebuilt here. The assets that were tested are the assets
      # that ship; this job only assembles and checks them. The payload is
      # flat, so these copies name files, not guessed directories.
      - name: Stage the asset set
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          STAGE="release/staged-v${V}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp incoming/openlidarviewer-*.zip "$STAGE"/
          cp incoming/sbom.json "$STAGE"/
          cp incoming/gate.log incoming/gate.log.sha256 "$STAGE"/
          cp "incoming/test-evidence-v${V}.json" "$STAGE"/
          cp "incoming/RELEASE_NOTES_v${V}.md" "$STAGE"/
          ls -la "$STAGE"

      - name: Bind the manifest
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          STAGE="release/staged-v${V}"
          node scripts/create-release-manifest.mjs \
            --asset-dir "$STAGE" \
            --evidence "$STAGE/test-evidence-v${V}.json" \
            --output "$STAGE/release-manifest-v${V}.json"

      - name: Checksum everything, manifest included
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          cd "release/staged-v${V}"
          # `--` ends option parsing. Without it a staged file whose name began
          # with a dash would be read as a flag: shasum exits 1 having written
          # nothing, `|| true` hides that, and the failure only resurfaces at
          # the verify step below as an unexplained mismatch. `./*` would also
          # work but would prefix every name in SHA256SUMS, which the release
          # asset verifier parses.
          shasum -a 256 -- * > SHA256SUMS.tmp || true
          grep -v ' SHA256SUMS' SHA256SUMS.tmp > SHA256SUMS
          rm SHA256SUMS.tmp
          shasum -a 256 -c SHA256SUMS

      - name: Verify the closed asset set
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          npm run release:verify -- --dir "release/staged-v${V}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          retention-days: 30
          path: release/staged-*/

  # ── The single status to gate publication on ──────────────────────────────
  release-ready:
    runs-on: ubuntu-latest
    needs: [validate, gate, stage]
    # This job only reports a status, so it needs no access to the repository.
    permissions: {}
    steps:
      - run: echo "Every blocking job passed for ${{ github.ref_name }}."

  # ── Draft prerelease, tag refs only ───────────────────────────────────────
  # A draft, never auto-published: a human reads the body and presses publish.
  # The tag-only condition is deliberate. An earlier revision let a manual
  # dispatch with an input flag reach this job from a branch, which would have
  # tried to create a release named after the branch.
  publish:
    runs-on: ubuntu-latest
    needs: release-ready
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      # Sigstore identifies this workflow by an OIDC token rather than a key
      # this repository holds, so there is nothing to store or rotate.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      # The manifest already proves the asset set agrees with itself: tag,
      # commit and per-asset digest all match. It cannot prove where the bytes
      # came from, because this repository generates it, and a consistent
      # manifest can be regenerated for substituted assets. Provenance is
      # signed against a public transparency log instead, so a reader can
      # establish that an archive was produced by this workflow at this commit
      # without trusting anything published alongside it.
      #
      # Only the archives and the SBOM are attested. SHA256SUMS and the
      # manifest are statements ABOUT those files; attesting a checksum of an
      # attested file establishes nothing further.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            assets/**/openlidarviewer-*.zip
            assets/**/sbom.json

      - name: Create the draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          # A prerelease tag carries a hyphen (v0.6.0-alpha.3); a stable one
          # does not (v0.6.0). So the flag follows the tag, and a stable tag
          # is eligible to be marked the latest release on publish.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
          # The release body is the shipped notes asset, so the page and the
          # hashed artifact carry the same bytes. Without this the action falls
          # back to the tag message.
          body_path: assets/RELEASE_NOTES_${{ github.ref_name }}.md
          files: assets/**/*
          fail_on_unmatched_files: true
