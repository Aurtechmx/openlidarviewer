name: Cross-browser (advisory)

# The deterministic Playwright set on the two engines that are not Chromium.
# A viewer that renders through WebGPU with a WebGL 2 fallback cannot claim to
# work in a browser nobody ran it in, so these legs run and are reported.
#
# WHY ADVISORY (`continue-on-error: true` on both jobs):
# a leg that goes red would otherwise block every unrelated pull request while
# its failures are being triaged. Chromium keeps the blocking duty:
# `e2e-deterministic` in ci.yml is the gate, and it is untouched by this
# workflow. Promote a job here to blocking by deleting its `continue-on-error`
# line once it has been green for a while.
#
# The firefox job reported 111 failures on every run from the day it was added,
# and the note that used to sit here guessed they were "engine differences".
# They were not, and none of the 111 involved Firefox behaviour at all: the job
# ran Firefox headless, and Firefox's headless widget on Linux cannot produce a
# WebGL 2 context, so the viewer had nothing to render into. The webkit job was
# the control that gave it away — same runner, same 165 tests, green
# throughout. See the comments on the test step below.
#
# Deliberately a separate file from ci.yml so `ci-green` — the required check —
# has no dependency on anything here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, matching ci.yml: each job only reads the checked-out code.
# Declared per job rather than at workflow level so a job added later has to
# state its own needs instead of inheriting a grant.
jobs:
  e2e-firefox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright Firefox
        run: ./node_modules/.bin/playwright install --with-deps firefox
      # Rounds out Mesa's DRI drivers. Measured on ubuntu 24.04: the leg gets a
      # WebGL 2 context without this (xvfb depends on libgl1, so `--with-deps`
      # already drags in libGLX_mesa), but with only that much the context
      # advertises 16 extensions instead of 17. This step is here so the job
      # runs the same GL feature set the fix was validated against, not because
      # the missing packages were the cause. llvmpipe is a software rasteriser,
      # which is fine at this size: the e2e fixtures are a 10-point PLY, a small
      # LAS, and a 3,600-point synthesised grid.
      - name: Round out the software OpenGL stack for Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1 libgles2
      # THIS is the fix. `xvfb-run` supplies the display that lets Firefox start
      # headful, and headful is the only configuration in which it produces a
      # WebGL 2 context on Linux — no pref substitutes for it. See the note on
      # the `firefox` project in playwright.config.ts for the measurements.
      # xvfb itself already comes from `--with-deps` (Playwright's shared tools
      # list installs it), so nothing extra is needed to get the binary.
      # Fail fast, and fail legibly. Without this the leg's failure mode is 111
      # timeouts across 40 minutes, every one of them downstream of a missing
      # WebGL context and none of them saying so. `glxinfo` answers before
      # Playwright starts; the preflight spec answers before the suite does.
      - name: Verify the runner has a software OpenGL renderer
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends mesa-utils
          xvfb-run -a glxinfo -B | tee /tmp/glxinfo.txt
          if ! grep -Eiq "llvmpipe|softpipe|software rasterizer" /tmp/glxinfo.txt; then
            echo "::error::No Mesa software renderer on this runner. Everything below would fail as a timeout."
            exit 1
          fi
      - name: Verify Firefox gets a WebGL 2 context
        run: |
          xvfb-run -a ./node_modules/.bin/playwright test \
            --project=firefox-preflight
      - name: Deterministic end-to-end tests on Firefox (advisory)
        run: xvfb-run -a ./node_modules/.bin/playwright test --project=firefox
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 7

  e2e-webkit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright WebKit
        run: ./node_modules/.bin/playwright install --with-deps webkit
      - name: Deterministic end-to-end tests on WebKit (advisory)
        run: ./node_modules/.bin/playwright test --project=webkit
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7
