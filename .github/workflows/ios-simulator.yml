# Real Mobile Safari on an iOS simulator, driven through XCUITest.
#
# WHY THIS EXISTS, GIVEN THE WEBKIT JOBS ALREADY RUN
# `browser-smoke.yml` runs Playwright's WebKit, including an iPhone-shaped
# project with touch emulation. That covers the engine and the mobile layout.
# What it cannot cover is iOS itself: Playwright synthesizes `PointerEvent`s
# in every engine it drives, so a gesture never leaves the page. Here the
# gesture is dispatched by the OS through XCUITest into real Mobile Safari,
# which is the only thing that exercises the iOS touch stack.
#
# ADVISORY, AND MANUAL. This is `workflow_dispatch` only. It is a new leg with
# moving parts outside this repository's control — an Appium driver, a
# simulator runtime, a WebDriverAgent build — and a leg like that must earn
# trust before it can block a merge. `L13` records the browser matrix as
# advisory; this joins it on those terms rather than as a required check.
name: iOS simulator

on:
  # `workflow_dispatch` alone cannot be triggered from a branch: GitHub only
  # offers it once the file is on the default branch. The path filter is how
  # the leg can be exercised before then, and it is self-limiting — it fires
  # only when the leg's own files change, never on ordinary work.
  push:
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'scripts/ios-touch-check.mjs'
      - 'scripts/pick-ios-simulator.mjs'
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device name, or blank for the first iPhone available
        required: false
        default: ''
      keep-artifacts:
        description: Upload screenshots even on success
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  mobile-safari:
    name: Mobile Safari on an iOS simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Record what the runner actually offers before depending on it. A leg
      # that fails three steps later on a missing runtime is a leg nobody can
      # diagnose from the log.
      - name: Record the toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - run: npm ci --ignore-scripts

      # The test seam is a build-time constant; without it `?test=1` mounts
      # nothing and the pose oracle has nothing to read.
      - name: Build with the test seam
        env:
          OLV_TEST_SEAM: '1'
        # The binary `npm ci` installed from the lockfile, never an on-demand fetch.
        run: ./node_modules/.bin/vite build

      # probe.html + its one small chunk, added to the SAME dist/ the step
      # above just built (vite.probe.config.ts sets emptyOutDir: false). It
      # carries no renderer — see scripts/ios-touch-trace.mjs's header — so
      # this build has nothing to do with the test seam; run before "Serve
      # the build" so both pages are already on disk when that server starts.
      - name: Build the iOS touch-trace probe
        run: ./node_modules/.bin/vite build --config vite.probe.config.ts

      # Bind 127.0.0.1 explicitly. `vite preview` defaults to `localhost`,
      # which macOS resolves to ::1 first, so a v4 probe and the simulator
      # both miss a server that is genuinely up. The simulator shares the
      # host's network stack, so this address is what it reaches too.
      - name: Serve the build
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:4173/" -o /dev/null; then
              echo "serving on 127.0.0.1:4173"; exit 0
            fi
            sleep 2
          done
          echo "::error::the preview server never answered on 127.0.0.1:4173"
          cat preview.log
          exit 1

      # Resolve the device rather than naming one. The runner image ships a
      # different iPhone generation every few months, so a hardcoded name is a
      # leg that goes red on someone else's schedule. A requested name wins
      # when it is present; otherwise the newest iPhone available is used, and
      # the choice is printed because a result should say which device it came
      # from.
      - name: Boot the simulator
        id: sim
        env:
          WANT: ${{ inputs.device }}
        run: |
          RESOLVED=$(node scripts/pick-ios-simulator.mjs) || {
            echo "::error::no iPhone simulator is available on this image"
            xcrun simctl list devices available
            exit 1
          }
          UDID="${RESOLVED%%|*}"
          NAME="${RESOLVED#*|}"
          echo "using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Pinned as a pair, to exact versions. The XCUITest driver declares a
      # peer of `^3.0.0-rc.2` on the server, so `appium@2` cannot carry it: the
      # install refuses with a version complaint rather than failing later at a
      # session. `appium@next` is 2.0.1, older than `latest`, so the tag is no
      # guide either. A curl loop replaces `wait-on` to avoid fetching a
      # package on the critical path just to poll a port.
      - name: Install Appium and the XCUITest driver
        run: |
          # Exact versions, and no lifecycle scripts: Appium's only one
          # auto-installs drivers named in an environment variable, which this
          # job does not set; the driver is installed explicitly below.
          npm i -g --ignore-scripts appium@3.7.0
          appium driver install xcuitest@12.13.1
          appium --port 4723 > appium.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4723/status -o /dev/null; then
              echo "appium is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::appium never answered on 127.0.0.1:4723"
          cat appium.log
          exit 1

      # Build WebDriverAgent before any session asks for it. Left to the
      # session, the compile runs inside the create-session request and takes
      # most of the time budget; built here, the session's own build step is
      # incremental and the log separates a build failure from a test one.
      - name: Build WebDriverAgent
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          WDA="$HOME/.appium/node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent"
          xcodebuild build-for-testing \
            -project "$WDA/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner \
            -destination "id=$UDID" \
            GCC_TREAT_WARNINGS_AS_ERRORS=0 COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -20

      # The WebDriverAgent build keeps the runner busy for minutes. Confirm
      # the device is still fully booted before the session asks for it.
      - name: Confirm the simulator is booted
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Drive the touch model in Mobile Safari
        env:
          OLV_SIM_UDID: ${{ steps.sim.outputs.udid }}
          OLV_SIM_DEVICE: ${{ steps.sim.outputs.name }}
          OLV_BASE_URL: http://127.0.0.1:4173
        run: node scripts/ios-touch-check.mjs

      # Independent of the step above: it drives a page that never renders,
      # so it has no reason to hit the GPU-driver crash L13 documents (see
      # scripts/ios-touch-trace.mjs's header) and runs whether or not that
      # step reached its own pose read. Same booted simulator and running
      # Appium/WebDriverAgent, so this only costs a second session, not a
      # second boot.
      - name: Record iOS touch traces (no WebGL)
        if: always()
        env:
          OLV_SIM_UDID: ${{ steps.sim.outputs.udid }}
          OLV_SIM_DEVICE: ${{ steps.sim.outputs.name }}
          OLV_BASE_URL: http://127.0.0.1:4173
          OLV_RUN_ID: ${{ github.run_id }}
        run: node scripts/ios-touch-trace.mjs

      - name: Capture the screen
        if: always()
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-screen.png || true

      # When Safari exits mid-run, its crash report is the only record of why.
      # Collected from the host and from inside the simulator's data volume.
      - name: Collect crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          UDID="${{ steps.sim.outputs.udid }}"
          find "$HOME/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs" \
            -type f \( -iname '*safari*' -o -iname '*webcontent*' -o -iname '*.ips' \) \
            -mmin -60 -exec cp {} crash-reports/ \; 2>/dev/null || true
          ls -la crash-reports
          # A process killed by the system (watchdog, memory limit, a lost
          # GPU context) leaves no crash report; the unified log records who
          # ended it and why.
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "SpringBoard" OR process == "runningboardd" OR process == "MobileSafari" OR process CONTAINS "WebKit" OR eventMessage CONTAINS[c] "mobilesafari" OR eventMessage CONTAINS[c] "jetsam"' \
            > crash-reports/sim-system.log 2>&1 || true
          wc -l crash-reports/sim-system.log
          # Safari has exited with a Metal status after its SimMetalHost
          # connection dropped. That service runs on the host, so its own
          # reason for ending is in the host's log and crash reports.
          log show --last 30m --style compact \
            --predicate 'process CONTAINS[c] "SimMetal" OR eventMessage CONTAINS[c] "SimMetalHost" OR (process == "kernel" AND eventMessage CONTAINS[c] "SimMetal")' \
            > crash-reports/host-simmetal.log 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -type f -iname '*SimMetal*' -mmin -60 -exec cp {} crash-reports/ \; 2>/dev/null || true
          wc -l crash-reports/host-simmetal.log

      - name: Upload evidence
        if: always() && (inputs.keep-artifacts == 'true' || failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-evidence
          path: |
            ios-screen.png
            ios-after-pinch.png
            appium.log
            preview.log
            ios-touch-result.json
            ios-touch-traces/
            crash-reports/
          retention-days: 7
