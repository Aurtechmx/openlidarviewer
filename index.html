<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Local-first browser-based point-cloud exploration" />
    <meta name="theme-color" content="#030817" />

    <!-- Share metadata: Open Graph (also read by most chat apps) + Twitter card. -->
    <meta property="og:title" content="OpenLiDARViewer" />
    <meta property="og:description" content="Local-first browser-based point-cloud exploration" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.openlidarviewer.org/" />
    <link rel="canonical" href="https://app.openlidarviewer.org/" />
    <meta property="og:image" content="https://app.openlidarviewer.org/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons + PWA manifest (served from public/, copied to the dist root). -->
    <!-- Olv Font 400/500 preloads are injected by the fontPreload plugin in
         vite.config.ts: in a build they name the hashed assets/ files the
         @font-face rules reference, so the preload and the stylesheet fetch the
         same bytes once (font-src 'self'). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>OpenLiDARViewer</title>
    <style>html, body { background: #030817; }</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
