<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Open any 3D scan — drone LiDAR or phone scan — instantly and privately, in a browser tab." />
    <meta name="theme-color" content="#0a0e1a" />

    <!-- Share metadata: Open Graph (also read by most chat apps) + Twitter card. -->
    <meta property="og:title" content="OpenLiDARViewer" />
    <meta property="og:description" content="Open any 3D scan — drone LiDAR or phone scan — instantly and privately, in a browser tab." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.openlidarviewer.org/" />
    <link rel="canonical" href="https://app.openlidarviewer.org/" />
    <meta property="og:image" content="https://app.openlidarviewer.org/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons + PWA manifest (served from public/, copied to the dist root). -->
    <!-- Manrope 400/500 carry the header and empty state. Preloading them starts
         the fetch with the document instead of after the stylesheet and first
         layout, so the first paint is already in Manrope and the header does not
         shift on the swap. Same-origin files (font-src 'self'); Vite hashes the
         path to the asset the @fontsource CSS also references. -->
    <link rel="preload" href="/node_modules/@fontsource/manrope/files/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/manrope/files/manrope-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>OpenLiDARViewer</title>
    <style>html, body { background: #0a0e1a; }</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
